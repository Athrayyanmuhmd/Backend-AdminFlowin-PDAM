$kind: graphql-request
name: createKelompokPelanggan
order: 3000
url: '{{baseUrl}}'
query: |-
  mutation CreateKelompokPelanggan($input: CreateKelompokPelangganInput!) {
    createKelompokPelanggan(input: $input) {
      _id
      namaKelompok
      hargaDiBawah10mKubik
      hargaDiAtas10mKubik
      biayaBeban
      createdAt
    }
  }
variables: |-
  {
    "input": {
      "namaKelompok": "Rumah Tangga A",
      "hargaDiBawah10mKubik": 1500,
      "hargaDiAtas10mKubik": 2500,
      "biayaBeban": 5000
    }
  }
