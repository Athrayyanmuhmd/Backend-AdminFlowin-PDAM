$kind: graphql-request
name: getLaporanByStatus
order: 3000
url: '{{baseUrl}}'
query: |-
  query GetLaporanByStatus($status: EnumWorkStatusPelanggan!) {
    getLaporanByStatus(status: $status) {
      _id
      namaLaporan
      masalah
      alamat
      jenisLaporan
      status
      createdAt
      idPengguna {
        _id
        namaLengkap
      }
    }
  }
variables: |-
  {
    "status": "Diajukan"
  }
