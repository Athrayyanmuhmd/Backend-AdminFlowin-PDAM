$kind: graphql-request
name: getWorkOrder
order: 4000
url: '{{baseUrl}}'
query: |-
  query GetWorkOrder($id: ID!) {
    getWorkOrder(id: $id) {
      _id
      status
      disetujui
      catatan
      createdAt
      updatedAt
      tim {
        _id
        namaLengkap
        noHP
      }
      idSurvei {
        _id
      }
      idLaporan {
        _id
        namaLaporan
      }
      idPemasangan {
        _id
      }
    }
  }
variables: |-
  {
    "id": "{{workorder_id}}"
  }
