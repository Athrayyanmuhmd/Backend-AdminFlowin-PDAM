$kind: graphql-request
name: getPenyelesaianLaporan
order: 2000
url: '{{baseUrl}}'
query: |-
  query GetPenyelesaianLaporan($id: ID!) {
    getPenyelesaianLaporan(id: $id) {
      _id
      urlGambar
      catatan
      tanggalSelesai
      createdAt
      metadata {
        durasiPengerjaan
        materialDigunakan
        biaya
      }
      idLaporan {
        _id
        namaLaporan
        masalah
        status
      }
      teknisiId {
        _id
        namaLengkap
        noHP
      }
    }
  }
variables: |-
  {
    "id": "{{penyelesaian_id}}"
  }
