$kind: graphql-request
name: assignTeknisiToKoneksi
order: 8000
url: '{{baseUrl}}'
query: |-
  mutation AssignTeknisiToKoneksi($id: ID!, $technicianId: ID!) {
    assignTeknisiToKoneksi(id: $id, technicianId: $technicianId) {
      _id
      assignedAt
      statusVerifikasi
      idTeknisi {
        _id
        namaLengkap
      }
      assignedBy {
        _id
        namaLengkap
      }
    }
  }
variables: |-
  {
    "id": "{{koneksidata_id}}",
    "technicianId": "{{teknisi_id}}"
  }
