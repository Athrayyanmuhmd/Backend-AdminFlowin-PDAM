$kind: graphql-request
name: getAllRABConnections
order: 1000
url: '{{baseUrl}}'
query: |-
  query {
    getAllRABConnections {
      _id
      totalBiaya
      statusPembayaran
      urlRab
      catatan
      createdAt
      idKoneksiData {
        _id
        alamat
        idPelanggan {
          _id
          namaLengkap
        }
      }
    }
  }
